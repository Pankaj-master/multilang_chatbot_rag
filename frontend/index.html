<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multilang Chatbot — UI</title>
  <!-- Tailwind via CDN for quick dev -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-4 flex flex-col gap-4">
    <header class="flex items-center justify-between">
      <h1 class="text-xl font-semibold">Multilang Chatbot</h1>
      <div class="text-sm text-slate-500">Node backend @ <span id="backend-url" class="font-medium">http://localhost:8001</span></div>
    </header>

    <main id="chat-window" class="flex-1 overflow-auto p-2 space-y-3" style="min-height:320px;">
      <!-- messages go here -->
    </main>

    <div class="flex gap-2">
      <input id="user-text" type="text" placeholder="Ask something..." class="flex-1 border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-sky-300" />
      <button id="send" class="bg-sky-600 text-white px-4 py-2 rounded-lg hover:bg-sky-700">Send</button>
      <button id="clear" class="bg-gray-100 text-slate-700 px-3 py-2 rounded-lg hover:bg-gray-200">Clear</button>
    </div>

    <footer class="text-xs text-slate-400 text-center">This is a dev UI — use for testing retrieval + LLM flows.</footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
